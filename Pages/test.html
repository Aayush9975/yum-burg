<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>API Practice</title>
  
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 50px;
    }

    /* Email Button */

    #emailBtn {
      padding: 12px 25px;
      background: black;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }
    /* Modal */

    .modal {
      display: none;

      position: fixed;
      inset: 0;

      background: rgba(0, 0, 0, 0.5);

      align-items: center;
      justify-content: center;
    }


    .modal-box {
      width: 350px;

      background: white;

      padding: 30px;

      border-radius: 10px;

      position: relative;
    }


    .close {
      position: absolute;

      right: 15px;
      top: 10px;

      border: none;
      background: none;

      font-size: 25px;

      cursor: pointer;
    }


    input {
      width: 100%;

      height: 45px;

      padding: 0 10px;

      box-sizing: border-box;

      margin: 15px 0;

      border: 1px solid #ccc;

      border-radius: 5px;
    }


    #submitBtn,
    #okBtn {

      width: 100%;

      padding: 12px;

      background: black;

      color: white;

      border: none;

      border-radius: 5px;

      cursor: pointer;
    }


    #error {
      color: red;

      margin-top: 10px;

      font-size: 13px;
    }


    .success {
      text-align: center;
    }

  </style>
</head>

<body>
  <!-- Email Button -->
  <button id="emailBtn">
    Email
  </button>

  <!-- Email Popup -->
  <div id="emailModal" class="modal">
    <div class="modal-box">
      <button id="closeEmail" class="close">
        ×
      </button>
      <h2>
        Get the Menu
      </h2>
      <p>
        Enter your email address and get the menu.
      </p>
      <form id="emailForm">
        <input
          type="email"
          id="email"
          placeholder="Enter your email address"
          required
        >
        <button
          type="submit"
          id="submitBtn"
        >
          Get the Menu
        </button>
        <div id="error"></div>
      </form>
    </div>
  </div>

  <!-- Success Popup -->
  <div id="successModal" class="modal">
    <div class="modal-box success">
      <button id="closeSuccess" class="close">
        ×
      </button>
      <h2>
        Thanks!
      </h2>
      <p>
        Your Menu will be forwarded shortly.
      </p>
      <button id="okBtn">
        OK
      </button>
    </div>
  </div>
<script src="../scripts/api.js"></script>
</body>

</html>
