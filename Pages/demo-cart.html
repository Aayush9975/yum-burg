<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Your Shopping Cart</title>
  <style>
    /* basic layout matching your screenshot design */
    body { font-family: sans-serif; background-color: #f2f3f5; margin: 0; }
    .cart-container { display: flex; max-width: 1100px; margin: 40px auto; background: #fff; border-radius: 12px; overflow: hidden; }
    .cart-items-section { flex: 2; padding: 30px; background-color: #f8f9fa; }
    .cart-item { display: flex; align-items: center; justify-content: space-between; background: #eaedef; padding: 15px; border-radius: 10px; margin-bottom: 15px; }
    .cart-item img { width: 60px; height: 60px; border-radius: 50%; object-fit: cover; }
    .item-info { flex: 1; margin-left: 15px; }
    .quantity-controls { display: flex; align-items: center; gap: 8px; }
    .qty-btn { background: #999; color: #fff; border: none; border-radius: 50%; width: 22px; height: 22px; cursor: pointer; }
    .remove-btn { background: none; border: none; font-size: 18px; cursor: pointer; color: #888; }
    .subtotal-container { display: flex; justify-content: space-between; font-weight: bold; font-size: 18px; margin-top: 30px; }
  </style>
</head>
<body>

  <div class="cart-container">
    <div class="cart-items-section">
      <h2>Your Shopping Cart</h2>
      
      <!-- Container where items dynamically render -->
      <div id="cart-list"></div>

      <div class="subtotal-container">
        <span>Subtotal:</span>
        <span id="subtotal-amount">$0.00</span>
      </div>
    </div>
  </div>

<script>
// Function to load and render cart items
function renderCart() {
  const cartList = document.getElementById('cart-list');
  const subtotalEl = document.getElementById('subtotal-amount');
  let cart = JSON.parse(localStorage.getItem('cart')) || [];

  if (cart.length === 0) {
    cartList.innerHTML = '<p>Your cart is empty.</p>';
    subtotalEl.innerText = '$0.00';
    return;
  }

  let cartHTML = '';
  let subtotal = 0;

  cart.forEach((item, index) => {
    const itemTotal = item.price * item.quantity;
    subtotal += itemTotal;

    cartHTML += `
      <div class="cart-item">
        <img src="${item.image}" alt="${item.name}">
        <div class="item-info">
          <strong>${item.name}</strong>
        </div>
        <div class="quantity-controls">
          <span>${item.quantity}</span>
          <div>
            <button class="qty-btn" onclick="updateQuantity(${index}, 1)">+</button>
            <button class="qty-btn" onclick="updateQuantity(${index}, -1)">-</button>
          </div>
        </div>
        <div>$${itemTotal.toFixed(2)}</div>
        <button class="remove-btn" onclick="removeItem(${index})">&times;</button>
      </div>
    `;
  });

  cartList.innerHTML = cartHTML;
  subtotalEl.innerText = `$${subtotal.toFixed(2)}`;
}

// Function to update item quantity (+ / -)
function updateQuantity(index, change) {
  let cart = JSON.parse(localStorage.getItem('cart')) || [];
  cart[index].quantity += change;

  if (cart[index].quantity <= 0) {
    cart.splice(index, 1); // Remove item if quantity becomes 0
  }

  localStorage.setItem('cart', JSON.stringify(cart));
  renderCart(); // Re-render updated UI
}

// Function to remove item completely
function removeItem(index) {
  let cart = JSON.parse(localStorage.getItem('cart')) || [];
  cart.splice(index, 1);
  localStorage.setItem('cart', JSON.stringify(cart));
  renderCart();
}

// Initial Call when page loads
renderCart();
</script>

</body>
</html>
