<body>
    <h2 id="h2">Enter The Details</h2>

        <div class="modal">

        <input type="number" id="age">
        <br><br>

        <label>Enter Your Mobile Number</label>
        <input type="text" id="mobileNumber" maxlength="10" onkeypress="return event.charCode >=48 && event.charCode<=57">
  <br><br>
        <button id="submitButton" type="button" onclick="submitForm()">Submit</button>
<p id="results"> </p>
    </form>
    </div></div>
